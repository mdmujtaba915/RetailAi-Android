name: Build RetailAI Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --org com.retailai .

      - name: Configure Android API 36 and disable Gradle file watching
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          s = s.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")
          p.write_text(s)

          g = Path("android/gradle.properties")
          s = g.read_text() if g.exists() else ""
          if "org.gradle.vfs.watch=false" not in s:
              s += "\norg.gradle.vfs.watch=false\n"
          g.write_text(s)
          PY

          grep -n "compileSdk\|targetSdk" android/app/build.gradle.kts
          grep -n "org.gradle.vfs.watch" android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Stop stale Gradle daemons
        run: |
          cd android
          ./gradlew --stop || true
          cd ..

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: retailai-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: retailai-aab
          path: build/app/outputs/bundle/release/app-release.aab
